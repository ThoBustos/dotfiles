# ~/.config/tmux/tmux.conf
# Managed by Chezmoi - https://github.com/ThoBustos/dotfiles

# ----------------------------
# General Settings
# ----------------------------

# Keep default prefix (Ctrl+b)
# Reason: Works on any system without relearning

# Mouse support
set -g mouse on

# Start windows and panes at 1 (not 0)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Prevent programs from renaming windows (keeps manual names)
set-option -g allow-rename off
set-window-option -g automatic-rename off

# Better colors
set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Faster escape (for vim/neovim)
set -sg escape-time 0

# More history
set -g history-limit 50000

# Clipboard (fixes copy issues on macOS)
set -g set-clipboard on

# ----------------------------
# Key Bindings
# ----------------------------

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes in current directory
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"

# Vim-style pane navigation (alongside arrows)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ----------------------------
# Plugins (via TPM)
# ----------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ----------------------------
# Fun Forrest Theme
# ----------------------------

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#251200,fg=#dec165"

# Session name (left)
set -g status-left "#[bg=#e5591c,fg=#251200,bold]  #S #[bg=#251200,fg=#e5591c,nobold]  "
set -g status-left-length 30

# Git branch + time (right)
set -g status-right "#[fg=#7cc9cf]#(cd #{pane_current_path} && git symbolic-ref --short HEAD 2>/dev/null)  #[fg=#dec165]%H:%M"
set -g status-right-length 50

# Window tabs
set -g window-status-format "#[fg=#7f6a55,bg=#251200]  #W  "
set -g window-status-current-format "#[fg=#251200,bg=#e5591c,bold]  #W  "
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#3d2000"
set -g pane-active-border-style "fg=#e5591c"

# Command/message line
set -g message-style "bg=#e5591c,fg=#251200,bold"
set -g message-command-style "bg=#e5591c,fg=#251200"

# ----------------------------
# Session Persistence
# ----------------------------

# Resurrect: save/restore sessions
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'  # Restore neovim sessions

# Continuum: auto-save and auto-restore
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# ----------------------------
# Initialize TPM (keep at bottom)
# ----------------------------

run '~/.tmux/plugins/tpm/tpm'
